<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tic-Tac-Toe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #667EEA;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .lobby {
            display: block;
        }

        .game-area {
            display: none;
        }

        .input-group {
            margin: 15px 0;
        }

        input {
            padding: 12px;
            font-size: 1.2em;
            border: 2px solid #667EEA;
            border-radius: 8px;
            width: 100%;
            margin: 10px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button {
            background: #667EEA;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764BA2;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .room-id {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 2em;
            font-weight: bold;
            color: #667EEA;
            letter-spacing: 5px;
        }

        .status {
            font-size: 1.1em;
            margin: 15px 0;
            color: #333;
            min-height: 30px;
            font-weight: 500;
        }

        .connection-status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
            font-size: 0.9em;
        }

        .connected {
            background: #4CAF50;
            color: white;
        }

        .waiting {
            background: #FFC107;
            color: #333;
        }

        .error {
            background: #f44336;
            color: white;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 10px;
            margin: 20px auto;
            justify-content: center;
        }

        .cell {
            background: #F0F0F0;
            border: 2px solid #ddd;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .cell:hover:not(:disabled) {
            background: #E0E0E0;
            transform: scale(1.05);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667EEA;
            background: #E8ECFF;
        }

        .cell.o {
            color: #764BA2;
            background: #F5E8FF;
        }

        .cell.winner {
            background: #FFD700 !important;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .score {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 0.95em;
        }

        .score div {
            padding: 8px 15px;
            border-radius: 8px;
            background: #F0F0F0;
        }

        .player-x {
            color: #667EEA;
            font-weight: bold;
        }

        .player-o {
            color: #764BA2;
            font-weight: bold;
        }

        .copy-btn {
            background: #4CAF50;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .copy-btn:hover {
            background: #45a049;
        }

        .debug {
            font-size: 0.75em;
            color: #999;
            margin-top: 10px;
            padding: 5px;
            background: #f9f9f9;
            border-radius: 5px;
            max-height: 60px;
            overflow-y: auto;
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 0.85em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎮 Multiplayer Tic-Tac-Toe</h1>

        <div class="lobby" id="lobby">
            <div class="input-group">
                <button onclick="createGame()">🎯 नवीन गेम तयार करा</button>
            </div>
            <div style="margin: 15px 0;">किंवा</div>
            <div class="input-group">
                <input type="text" id="joinRoomId" placeholder="कोड टाका" maxlength="6">
                <button onclick="joinGame()">🚀 सामील व्हा</button>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="connection-status waiting" id="connectionStatus">
                प्रतीक्षा करत आहे...
            </div>

            <div id="roomInfo" style="display:none;">
                <p style="margin: 10px 0; font-weight: bold; font-size: 0.9em;">तुमचा गेम कोड:</p>
                <div class="room-id" id="roomIdDisplay"></div>
                <button class="copy-btn" onclick="copyRoomId()">📋 कॉपी करा</button>
                <p style="margin-top: 10px; font-size: 0.85em; color: #666;">
                    हा कोड मित्राला पाठवा
                </p>
            </div>

            <div class="score">
                <div>
                    <span class="player-x" id="myLabel">तुम्ही:</span>
                    <span id="myScore">0</span>
                </div>
                <div>
                    <span class="player-o" id="opponentLabel">प्रतिस्पर्धी:</span>
                    <span id="opponentScore">0</span>
                </div>
            </div>

            <div class="status" id="status"></div>

            <div class="board" id="board"></div>

            <button onclick="requestReset()">🔄 नवीन राउंड</button>
            <button onclick="backToLobby()" style="background: #666;">🏠 बाहेर पडा</button>

            <div class="debug" id="debug">Debug info येथे दिसेल...</div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let roomCode = null;
        let isHost = false;
        let mySymbol = '';
        let currentPlayer = 'X';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = false;
        let myScore = 0;
        let opponentScore = 0;
        let debugLogs = [];
        let connectionAttempts = 0;
        const MAX_CONNECTION_ATTEMPTS = 3;

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // Enhanced PeerJS configuration with STUN/TURN servers
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            },
            debug: 2
        };

        function log(msg) {
            console.log(msg);
            const timestamp = new Date().toLocaleTimeString();
            debugLogs.push(`${timestamp}: ${msg}`);
            if (debugLogs.length > 5) debugLogs.shift();
            document.getElementById('debug').innerHTML = debugLogs.join('<br>');
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.disabled = true;
                cell.onclick = () => handleCellClick(i);
                boardEl.appendChild(cell);
            }
        }

        function createGame() {
            roomCode = generateRoomCode();
            const peerId = 'ttt-' + roomCode;

            log('Creating room: ' + roomCode);
            peer = new Peer(peerId, peerConfig);

            peer.on('open', (id) => {
                isHost = true;
                mySymbol = 'X';
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('roomInfo').style.display = 'block';
                document.getElementById('roomIdDisplay').textContent = roomCode;
                document.getElementById('connectionStatus').textContent = '⏳ दुसऱ्या खेळाडूची प्रतीक्षा...';
                document.getElementById('myLabel').innerHTML = '<span class="player-x">तुम्ही (X):</span>';
                document.getElementById('opponentLabel').innerHTML = '<span class="player-o">प्रतिस्पर्धी (O):</span>';
                initBoard();
                log('✅ Room created successfully: ' + id);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                log('📞 Incoming connection...');
                setupConnection();
            });

            peer.on('error', (err) => {
                handlePeerError(err);
            });
        }

        function joinGame() {
            roomCode = document.getElementById('joinRoomId').value.trim().toUpperCase();
            if (!roomCode || roomCode.length !== 6) {
                alert('कृपया 6 अक्षरांचा कोड टाका');
                return;
            }

            connectionAttempts++;
            log(`Connection attempt ${connectionAttempts}/${MAX_CONNECTION_ATTEMPTS}`);

            peer = new Peer(peerConfig);

            peer.on('open', (id) => {
                isHost = false;
                mySymbol = 'O';
                const targetId = 'ttt-' + roomCode;

                log('🔗 Connecting to: ' + targetId);

                conn = peer.connect(targetId, {
                    reliable: true,
                    serialization: 'json'
                });

                setupConnection();

                document.getElementById('lobby').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('connectionStatus').textContent = '⏳ जोडत आहे...';
                document.getElementById('myLabel').innerHTML = '<span class="player-o">तुम्ही (O):</span>';
                document.getElementById('opponentLabel').innerHTML = '<span class="player-x">प्रतिस्पर्धी (X):</span>';
                initBoard();
            });

            peer.on('error', (err) => {
                handlePeerError(err);
            });
        }

        function setupConnection() {
            if (!conn) {
                log('❌ No connection object');
                return;
            }

            conn.on('open', () => {
                log('✅ Connection established!');
                connectionAttempts = 0;
                connectionEstablished();
            });

            conn.on('data', (data) => {
                log('📩 Data received: ' + data.type);
                handleIncomingData(data);
            });

            conn.on('close', () => {
                log('🔌 Connection closed');
                handleDisconnection();
            });

            conn.on('error', (err) => {
                log('⚠️ Connection error: ' + err.type);

                if (connectionAttempts < MAX_CONNECTION_ATTEMPTS && !isHost) {
                    log('🔄 Retrying connection...');
                    setTimeout(() => {
                        backToLobby();
                        setTimeout(() => {
                            document.getElementById('joinRoomId').value = roomCode;
                            joinGame();
                        }, 500);
                    }, 2000);
                } else {
                    document.getElementById('connectionStatus').textContent = '❌ जोडता आले नाही';
                    document.getElementById('connectionStatus').className = 'connection-status error';
                }
            });
        }

        function handlePeerError(err) {
            log('🚨 Peer error: ' + err.type);

            if (err.type === 'peer-unavailable') {
                document.getElementById('connectionStatus').textContent = '❌ कोड चुकीचा आहे किंवा गेम उपलब्ध नाही';
                document.getElementById('connectionStatus').className = 'connection-status error';
            } else if (err.type === 'network') {
                document.getElementById('connectionStatus').textContent = '❌ नेटवर्क एरर';
                document.getElementById('connectionStatus').className = 'connection-status error';
            } else {
                document.getElementById('connectionStatus').textContent = '❌ एरर: ' + err.type;
                document.getElementById('connectionStatus').className = 'connection-status error';
            }
        }

        function handleIncomingData(data) {
            try {
                switch (data.type) {
                    case 'test':
                        log('✓ Test message from ' + data.from);
                        break;
                    case 'move':
                        applyMove(data.index, data.player);
                        break;
                    case 'reset':
                        resetGameState();
                        break;
                    default:
                        log('Unknown data type: ' + data.type);
                }
            } catch (e) {
                log('❌ Error handling data: ' + e.message);
            }
        }

        function handleDisconnection() {
            document.getElementById('connectionStatus').textContent = '❌ संपर्क तुटला!';
            document.getElementById('connectionStatus').className = 'connection-status error';
            gameActive = false;
            disableBoard();
        }

        function connectionEstablished() {
            document.getElementById('connectionStatus').textContent = '✅ जोडले गेले - खेळा!';
            document.getElementById('connectionStatus').className = 'connection-status connected';
            document.getElementById('roomInfo').style.display = 'none';
            gameActive = true;
            currentPlayer = 'X';
            enableBoard();
            updateStatus();

            // Send initial handshake
            sendData({ type: 'test', from: mySymbol });
        }

        function sendData(data) {
            if (!conn) {
                log('⚠️ No connection');
                return false;
            }

            if (!conn.open) {
                log('⚠️ Connection not open');
                return false;
            }

            try {
                conn.send(data);
                log('📤 Sent: ' + data.type);
                return true;
            } catch (e) {
                log('❌ Send failed: ' + e.message);
                return false;
            }
        }

        function handleCellClick(index) {
            if (board[index] !== '') {
                log('Cell occupied');
                return;
            }

            if (!gameActive) {
                log('Game inactive');
                return;
            }

            if (currentPlayer !== mySymbol) {
                log('Not your turn');
                return;
            }

            log(`Move: cell ${index} as ${mySymbol}`);
            applyMove(index, mySymbol);
            sendData({
                type: 'move',
                index: index,
                player: mySymbol
            });
        }

        function applyMove(index, player) {
            board[index] = player;

            const cells = document.querySelectorAll('.cell');
            const cell = cells[index];
            cell.textContent = player;
            cell.classList.add(player.toLowerCase());
            cell.disabled = true;

            if (checkWin(player)) {
                const winner = player === mySymbol ? '🎉 तुम्ही जिंकलात!' : '😔 प्रतिस्पर्धी जिंकला!';
                document.getElementById('status').textContent = winner;
                gameActive = false;
                highlightWinner(player);

                if (player === mySymbol) {
                    myScore++;
                    document.getElementById('myScore').textContent = myScore;
                } else {
                    opponentScore++;
                    document.getElementById('opponentScore').textContent = opponentScore;
                }
                disableBoard();
                return;
            }

            if (checkDraw()) {
                document.getElementById('status').textContent = '🤝 बरोबरी!';
                gameActive = false;
                disableBoard();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function highlightWinner(player) {
            const cells = document.querySelectorAll('.cell');
            winPatterns.forEach(pattern => {
                if (pattern.every(index => board[index] === player)) {
                    pattern.forEach(index => {
                        cells[index].classList.add('winner');
                    });
                }
            });
        }

        function checkDraw() {
            return board.every(cell => cell !== '');
        }

        function updateStatus() {
            if (!gameActive) return;
            const turn = currentPlayer === mySymbol ? '✨ तुमची पाळी' : '⏳ प्रतिस्पर्धीची पाळी';
            document.getElementById('status').textContent = turn;
        }

        function enableBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                const index = parseInt(cell.dataset.index);
                if (!board[index]) {
                    cell.disabled = false;
                }
            });
        }

        function disableBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.disabled = true;
            });
        }

        function requestReset() {
            sendData({ type: 'reset' });
            resetGameState();
        }

        function resetGameState() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;

            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
                cell.disabled = false;
            });

            updateStatus();
            enableBoard();
        }

        function copyRoomId() {
            const roomId = document.getElementById('roomIdDisplay').textContent;
            navigator.clipboard.writeText(roomId).then(() => {
                alert('✅ कोड कॉपी झाला!');
            }).catch(() => {
                prompt('हा कोड कॉपी करा:', roomId);
            });
        }

        function backToLobby() {
            if (conn) {
                try {
                    conn.close();
                } catch (e) {
                    log('Error closing connection: ' + e.message);
                }
            }
            if (peer) {
                try {
                    peer.destroy();
                } catch (e) {
                    log('Error destroying peer: ' + e.message);
                }
            }
            location.reload();
        }

        window.onload = () => {
            initBoard();
            log('App ready');
        };
    </script>
</body>

</html>
