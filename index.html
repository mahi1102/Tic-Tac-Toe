<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Tic-Tac-Toe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #667EEA;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .lobby {
            display: block;
        }

        .game-area {
            display: none;
        }

        .input-group {
            margin: 20px 0;
        }

        input {
            padding: 12px;
            font-size: 1.2em;
            border: 2px solid #667EEA;
            border-radius: 8px;
            width: 100%;
            margin: 10px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button {
            background: #667EEA;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764BA2;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .room-id {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 2em;
            font-weight: bold;
            color: #667EEA;
            letter-spacing: 5px;
        }

        .status {
            font-size: 1.2em;
            margin: 15px 0;
            color: #333;
            min-height: 30px;
            font-weight: 500;
        }

        .connection-status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
        }

        .connected {
            background: #4CAF50;
            color: white;
        }

        .waiting {
            background: #FFC107;
            color: #333;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            margin: 20px auto;
            justify-content: center;
        }

        .cell {
            background: #F0F0F0;
            border: none;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .cell:hover:not(:disabled) {
            background: #E0E0E0;
            transform: scale(1.05);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667EEA;
        }

        .cell.o {
            color: #764BA2;
        }

        .cell.winner {
            background: #FFD700;
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .score {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 1em;
        }

        .score div {
            padding: 8px 15px;
            border-radius: 8px;
            background: #F0F0F0;
        }

        .player-x {
            color: #667EEA;
            font-weight: bold;
        }

        .player-o {
            color: #764BA2;
            font-weight: bold;
        }

        .copy-btn {
            background: #4CAF50;
            padding: 8px 15px;
            font-size: 0.9em;
        }

        .copy-btn:hover {
            background: #45a049;
        }

        .debug {
            font-size: 0.8em;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎮 Multiplayer Tic-Tac-Toe</h1>

        <div class="lobby" id="lobby">
            <div class="input-group">
                <button onclick="createGame()">🎯 नवीन गेम तयार करा</button>
            </div>
            <div style="margin: 20px 0;">किंवा</div>
            <div class="input-group">
                <input type="text" id="joinRoomId" placeholder="कोड टाका (उदा: ABC123)" maxlength="6">
                <button onclick="joinGame()">🚀 गेममध्ये सामील व्हा</button>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="connection-status waiting" id="connectionStatus">
                प्रतीक्षा करत आहे...
            </div>

            <div id="roomInfo" style="display:none;">
                <p style="margin: 10px 0; font-weight: bold;">तुमचा गेम कोड:</p>
                <div class="room-id" id="roomIdDisplay"></div>
                <button class="copy-btn" onclick="copyRoomId()">📋 कोड कॉपी करा</button>
                <p style="margin-top: 10px; font-size: 0.9em; color: #666;">
                    हा कोड तुमच्या मित्राला पाठवा
                </p>
            </div>

            <div class="score">
                <div>
                    <span class="player-x" id="myLabel">तुम्ही:</span>
                    <span id="myScore">0</span>
                </div>
                <div>
                    <span class="player-o" id="opponentLabel">प्रतिस्पर्धी:</span>
                    <span id="opponentScore">0</span>
                </div>
            </div>

            <div class="status" id="status"></div>

            <div class="board" id="board"></div>

            <button onclick="requestReset()">🔄 नवीन राउंड</button>
            <button onclick="backToLobby()" style="background: #666;">🏠 मुख्य मेनू</button>

            <div class="debug" id="debug"></div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let myId = null;
        let roomCode = null;
        let isHost = false;
        let mySymbol = '';
        let currentPlayer = 'X';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = false;
        let myScore = 0;
        let opponentScore = 0;

        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // Generate short room code
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Initialize board
        function initBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.disabled = true;
                cell.onclick = () => handleCellClick(i);
                boardEl.appendChild(cell);
            }
        }

        function createGame() {
            roomCode = generateRoomCode();
            peer = new Peer('ttt-' + roomCode);

            peer.on('open', (id) => {
                myId = id;
                isHost = true;
                mySymbol = 'X';
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('roomInfo').style.display = 'block';
                document.getElementById('roomIdDisplay').textContent = roomCode;
                document.getElementById('connectionStatus').textContent = '⏳ दुसऱ्या खेळाडूची प्रतीक्षा...';
                document.getElementById('myLabel').textContent = 'तुम्ही (X):';
                document.getElementById('opponentLabel').textContent = 'प्रतिस्पर्धी (O):';
                initBoard();
                updateDebug('Room created: ' + roomCode);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('connectionStatus').textContent = '✅ जोडले गेले!';
                document.getElementById('connectionStatus').className = 'connection-status connected';
                document.getElementById('roomInfo').style.display = 'none';

                // Send initial sync
                setTimeout(() => {
                    sendMessage({ type: 'sync', board, currentPlayer, myScore, opponentScore });
                    startGame();
                }, 100);
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                updateDebug('Error: ' + err.type);
            });
        }

        function joinGame() {
            roomCode = document.getElementById('joinRoomId').value.trim().toUpperCase();
            if (!roomCode || roomCode.length !== 6) {
                alert('कृपया 6 अक्षरांचा कोड टाका');
                return;
            }

            peer = new Peer();

            peer.on('open', (id) => {
                myId = id;
                isHost = false;
                mySymbol = 'O';
                const targetId = 'ttt-' + roomCode;
                conn = peer.connect(targetId);
                setupConnection();
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('connectionStatus').textContent = '⏳ जोडत आहे...';
                document.getElementById('myLabel').textContent = 'तुम्ही (O):';
                document.getElementById('opponentLabel').textContent = 'प्रतिस्पर्धी (X):';
                initBoard();
                updateDebug('Joining: ' + roomCode);
            });

            peer.on('error', (err) => {
                console.error('Peer error:', err);
                alert('जोडता आले नाही! कोड तपासा.');
                backToLobby();
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('connectionStatus').textContent = '✅ जोडले गेले!';
                document.getElementById('connectionStatus').className = 'connection-status connected';
                updateDebug('Connected!');

                if (!isHost) {
                    sendMessage({ type: 'ready' });
                    startGame();
                }
            });

            conn.on('data', (data) => {
                updateDebug('Received: ' + data.type);
                handleMessage(data);
            });

            conn.on('close', () => {
                document.getElementById('connectionStatus').textContent = '❌ संपर्क तुटला!';
                document.getElementById('connectionStatus').className = 'connection-status waiting';
                gameActive = false;
                disableBoard();
                updateDebug('Connection closed');
            });

            conn.on('error', (err) => {
                console.error('Connection error:', err);
                updateDebug('Connection error');
            });
        }

        function sendMessage(data) {
            if (conn && conn.open) {
                conn.send(data);
                updateDebug('Sent: ' + data.type);
            }
        }

        function handleMessage(data) {
            switch (data.type) {
                case 'sync':
                    board = data.board;
                    currentPlayer = data.currentPlayer;
                    myScore = data.opponentScore || 0;
                    opponentScore = data.myScore || 0;
                    updateScoreDisplay();
                    renderBoard();
                    break;
                case 'ready':
                    if (isHost) {
                        startGame();
                    }
                    break;
                case 'move':
                    receiveMove(data.index, data.player);
                    break;
                case 'reset':
                    resetGameState();
                    break;
            }
        }

        function startGame() {
            gameActive = true;
            currentPlayer = 'X';
            enableBoard();
            updateStatus();
            updateDebug('Game started!');
        }

        function handleCellClick(index) {
            if (board[index] !== '' || !gameActive || currentPlayer !== mySymbol) {
                return;
            }

            makeMove(index, mySymbol);
            sendMessage({ type: 'move', index: index, player: mySymbol });
        }

        function makeMove(index, player) {
            board[index] = player;
            renderBoard();

            if (checkWin(player)) {
                const winner = player === mySymbol ? 'तुम्ही जिंकलात' : 'प्रतिस्पर्धी जिंकला';
                document.getElementById('status').textContent = `🎉 ${winner}!`;
                gameActive = false;
                highlightWinner(player);

                if (player === mySymbol) {
                    myScore++;
                } else {
                    opponentScore++;
                }
                updateScoreDisplay();
                disableBoard();
                return;
            }

            if (checkDraw()) {
                document.getElementById('status').textContent = '🤝 बरोबरी!';
                gameActive = false;
                disableBoard();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
        }

        function receiveMove(index, player) {
            makeMove(index, player);
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.textContent = board[i];
                cell.className = 'cell';
                if (board[i]) {
                    cell.classList.add(board[i].toLowerCase());
                }
            });
        }

        function checkWin(player) {
            return winPatterns.some(pattern => {
                return pattern.every(index => board[index] === player);
            });
        }

        function highlightWinner(player) {
            const cells = document.querySelectorAll('.cell');
            winPatterns.forEach(pattern => {
                if (pattern.every(index => board[index] === player)) {
                    pattern.forEach(index => {
                        cells[index].classList.add('winner');
                    });
                }
            });
        }

        function checkDraw() {
            return board.every(cell => cell !== '');
        }

        function updateStatus() {
            if (!gameActive) return;
            const turn = currentPlayer === mySymbol ? '✨ तुमची पाळी' : '⏳ प्रतिस्पर्धीची पाळी';
            document.getElementById('status').textContent = turn;
        }

        function updateScoreDisplay() {
            document.getElementById('myScore').textContent = myScore;
            document.getElementById('opponentScore').textContent = opponentScore;
        }

        function enableBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                if (!board[cell.dataset.index]) {
                    cell.disabled = false;
                }
            });
        }

        function disableBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.disabled = true;
            });
        }

        function requestReset() {
            sendMessage({ type: 'reset' });
            resetGameState();
        }

        function resetGameState() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            renderBoard();
            updateStatus();
            enableBoard();
            updateDebug('Game reset');
        }

        function copyRoomId() {
            const roomId = document.getElementById('roomIdDisplay').textContent;
            navigator.clipboard.writeText(roomId).then(() => {
                alert('✅ कोड कॉपी झाला!');
            }).catch(() => {
                prompt('हा कोड कॉपी करा:', roomId);
            });
        }

        function backToLobby() {
            if (conn) conn.close();
            if (peer) peer.destroy();
            location.reload();
        }

        function updateDebug(msg) {
            console.log(msg);
            document.getElementById('debug').textContent = msg;
        }

        // Initialize on load
        window.onload = () => {
            initBoard();
        };
    </script>
</body>

</html>
